name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          java_version=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $1}')
          if [ "$java_version" -ge 17 ]; then
            echo "Java version $java_version is 17 or newer."
          else
            echo "Error: Java version is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -f ./debug.keystore ]; then
            echo "Debug keystore verified successfully."
          else
            echo "Error: Failed to create debug keystore."
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$apk_path" ]; then
            echo "APK exists at $apk_path"
          else
            echo "Error: APK not found at expected path."
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p temp_release_asset
          repo_name=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          asset_name="${repo_name}-debug-build-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "temp_release_asset/$asset_name"
          echo "asset_path=temp_release_asset/$asset_name" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          tag_name="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          release_title="Debug APK Build #${{ github.run_number }}"
          asset_path="${{ steps.prepare_asset.outputs.asset_path }}"
          
          gh release create "$tag_name" "$asset_path" \
            --target "${{ github.sha }}" \
            --title "$release_title" \
            --latest \
            --notes "This is an automatically generated debug APK.
            - Built by GitHub Actions (Run: ${{ github.run_number }}, Attempt: ${{ github.run_attempt }})
            - Commit SHA: ${{ github.sha }}
            - Signed with a temporary debug keystore for testing purposes only."

      - name: Report APK download result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            tag_name="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release published successfully!"
            gh release view "$tag_name"
            release_url=$(gh release view "$tag_name" --json url --jq .url)
            echo "Release URL: $release_url"
            echo "### APK Build & Release Success!" >> $GITHUB_STEP_SUMMARY
            echo "You can download the APK from the [GitHub Releases Assets section]($release_url)." >> $GITHUB_STEP_SUMMARY
          else
            echo "Warning: GitHub Release publishing failed, but the APK build succeeded."
            echo "### APK Build Succeeded (Release Publishing Failed)" >> $GITHUB_STEP_SUMMARY
            echo "The Actions artifact named **app-debug-apk** remains available for download." >> $GITHUB_STEP_SUMMARY
          fi
